name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TRIPLET: arm64-android-sdl
      VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/.vcpkg-cache
    steps:
      - uses: actions/checkout@v4

      # Repo ini hanya berisi file yang kita ubah atau tambah. Kode asli OpenEmpires diambil di
      # commit yang sama dengan yang dipatch, lalu perubahan diterapkan di atasnya.
      - name: Fetch OpenEmpires base and apply patch
        run: |
          git clone https://github.com/OpenEmpiresProject/OpenEmpires.git base-src
          git -C base-src checkout c56fb6cd3c48d88d992276763242aafc15c73676
          rsync -a --ignore-existing --exclude '.git' --exclude '.github' base-src/ ./
          python3 tools/apply_android_patch.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # NDK 27 (Clang 18): seangkatan dengan fmt 11.0.2 dari vcpkg. NDK terbaru (Clang 21)
      # gagal mengompilasi FMT_STRING di spdlog dengan galat "call to consteval function".
      - name: Select NDK 27
        run: |
          NDK=$(ls -d "$ANDROID_HOME"/ndk/27.* 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$NDK" ]; then
            echo "NDK 27 tidak ada di runner (yang ada: $(ls "$ANDROID_HOME"/ndk | tr '\n' ' ')), memasang..."
            yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018" > /dev/null
            NDK="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "Memakai NDK: $NDK"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: .vcpkg-cache
          key: vcpkg-${{ env.TRIPLET }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'triplets/**') }}

      - name: Get vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      # Ubah definisi entitas Python menjadi JSON (game Android tidak memuat Python)
      - name: Export entity models
        run: python tools/export_models.py assets/scripts assets/scripts/models.json

      # CMAKE_CXX_FLAGS:
      #  -include android_compat.h : header standar yang di MSVC masuk diam-diam (mis. <list>)
      - name: Configure
        run: |
          sudo apt-get update && sudo apt-get install -y ninja-build
          cmake -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_CHAINLOAD_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DVCPKG_OVERLAY_TRIPLETS="$PWD/triplets" \
            -DVCPKG_TARGET_TRIPLET="$TRIPLET" \
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-28 \
            -DCMAKE_CXX_FLAGS="-include $PWD/src/cpp/android_compat.h" \
            -DOE_USE_PYTHON=OFF

      - name: Build native library
        run: |
          set -o pipefail
          cmake --build build-android --target openEmpires -j"$(nproc)" 2>&1 | tee build-android.log

      # Ringkasan galat kompilasi (pendek), supaya mudah dibaca di HP
      - name: Show compile errors
        if: failure()
        run: |
          grep -nE "error:|FAILED:" build-android.log 2>/dev/null | cut -c1-300 | head -40 || true

      - name: Collect native libraries
        run: |
          JNI=android/app/src/main/jniLibs/arm64-v8a
          mkdir -p "$JNI"
          find build-android -name libmain.so -exec cp {} "$JNI/" \;
          find build-android/vcpkg_installed/"$TRIPLET" -name 'libSDL3.so*' -exec cp -L {} "$JNI/libSDL3.so" \; -quit
          ls -l "$JNI"

      # SDLActivity (Java) harus dari versi SDL yang sama dengan libSDL3.so
      - name: Fetch SDL Java sources
        run: |
          VER=$(grep -hE 'set\(PACKAGE_VERSION "' build-android/vcpkg_installed/"$TRIPLET"/share/sdl3/*ersion*.cmake | head -1 | sed -E 's/.*"([0-9.]+)".*/\1/')
          echo "SDL version: $VER"
          git clone --depth 1 --branch "release-$VER" https://github.com/libsdl-org/SDL.git sdl-src
          mkdir -p android/app/src/main/java
          cp -r sdl-src/android-project/app/src/main/java/org android/app/src/main/java/

      - name: Bundle game assets
        run: |
          DEST=android/app/src/main/assets/assets
          mkdir -p "$DEST"
          rsync -a --exclude '__pycache__' --exclude '*.py' --exclude '*.drs' assets/ "$DEST/"
          find "$DEST" -type f | head -50

      - name: Build APK
        run: gradle -p android assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OpenEmpires-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-android.log
            vcpkg/buildtrees/**/*.log
            build-android/vcpkg-manifest-install.log
            build-android/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
