plugins {
    id 'com.android.application'
}

android {
    namespace 'org.openempires.app'
    compileSdk 34

    defaultConfig {
        applicationId 'org.openempires.app'
        minSdk 28
        targetSdk 34
        versionCode 1
        versionName '0.4.0'

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    // Diisi oleh CI (.github/workflows/android.yml):
    //   src/main/jniLibs/arm64-v8a/  -> libmain.so, libSDL3.so
    //   src/main/assets/assets/      -> aset game (tanpa file .drs)
    //   src/main/java/org/libsdl/    -> SDLActivity dari rilis SDL yang sama dengan libSDL3.so
    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
